<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links da Bio</title>
    <style>
     html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden; /* Mata o scroll lateral de vez */
    position: fixed;    /* Impede que a página "balance" no celular */
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw; /* Usa a largura da janela de visualização */
    height: 100vh; /* Usa a altura da janela de visualização */
    background: url('fundo.png') no-repeat center center;
    background-size: cover;
    z-index: -1;
    /* Força o navegador a não redimensionar a imagem */
    background-attachment: scroll; 
}

.container {
    position: absolute; /* Permite posicionar sobre o fundo fixo */
    top: 0;
    left: 50%;
    transform: translateX(-50%); /* Centralização perfeita */
    width: 100%;
    max-width: 400px;
    height: 100%;
    overflow-y: auto; /* Permite rolar os botões se eles forem muitos, sem mexer o fundo */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 45vh; /* Ajuste aqui para descer os botões */
    box-sizing: border-box; /* Garante que o padding não estique a largura */
}

.link-button {
    width: 40%;
    margin-bottom: 15px;
    flex-shrink: 0; /* Impede que o botão seja esmagado */
}

.link-button img {
    width: 100%;
    height: auto;
}
      .frase-destaque {
    background-color: rgba(255, 255, 255, 0.8); /* Fundo branco semi-transparente */
    color: #333;                               /* Cor do texto */
    padding: 10px 20px;                        /* Espaço interno */
    border-radius: 20px;                       /* Bordas arredondadas */
    font-weight: bold;                         /* Negrito */
    margin-bottom: 20px;                       /* Espaço para os botões */
    display: inline-block;                     /* Ajusta o fundo ao tamanho do texto */
    font-size: 0.7rem;
    width: 70%;
    text-align: center;
}
    </style>
</head>
<body>

    <div class="container">
      <p class="frase-destaque">Escolha onde ouvir e acompanhe o podcast Jesus Entre Linhas</p>
        <!-- Adicione aqui seus links e as imagens dos botões -->
        
        <a href="https://www.deezer.com/br/show/1002892271" class="link-button">
            <img src="spotify.png" alt="">
        </a>

        <a href="https://open.spotify.com/show/1lsiaZFPzBaf5tg7DKqqXq?si=T9fbz4jdSnOylK8ii6SG1Q" class="link-button">
            <img src="deezer.png" alt="">
        </a>

        <a href="https://music.amazon.com.br/podcasts/cc2dfb5a-50a7-481a-833d-5d99e42d06f3/jesus-entre-linhas" class="link-button">
            <img src="amazon.png" alt="">
        </a>

    </div>

</body>
</html>
